name: CI

# Roda em toda alteração da main e em todo pull request. O objetivo é que
# nada chegue à main sem passar por lint, testes, auditoria de
# dependências e varredura de segredos.

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerabilidade nova não espera commit: a auditoria roda semanalmente
  # mesmo sem alteração no código.
  schedule:
    - cron: '0 6 * * 1'

# Cancela execuções antigas do mesmo branch, para não gastar fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks precisa do histórico para varrer commits anteriores.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Mesma versão de render.yaml e do desenvolvimento.
          node-version: '24'
          cache: npm

      # Segredos gerados por execução, nunca escritos no repositório.
      #
      # A primeira versão deste arquivo trazia os valores literais, e o
      # gitleaks os apontou como segredo vazado — corretamente, porque um
      # valor com entropia alta num arquivo versionado é indistinguível de
      # uma chave real. Gerar aqui resolve os dois lados: não há nada para
      # o scanner achar, e cada execução usa um valor descartável.
      - name: Gerar segredos descartáveis
        run: |
          JWT="$(openssl rand -base64 48 | tr -d '\n')"
          ENC="$(openssl rand -base64 32 | tr -d '\n')"

          # Mascara nos logs: as etapas seguintes imprimem o bloco env.
          echo "::add-mask::$JWT"
          echo "::add-mask::$ENC"

          {
            echo "JWT_SECRET=$JWT"
            echo "ENCRYPTION_KEY=$ENC"
            echo "APP_URL=http://localhost:3000"
            # SQLite temporário, na área descartável do runner.
            echo "DATABASE_URL=file:$RUNNER_TEMP/ci.db"
          } >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm ci

      # Antes de tsc e do build: os dois dependem dos tipos gerados.
      - name: Gerar o cliente do Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npx next build

      # Falha em vulnerabilidade alta ou crítica. Moderadas e baixas
      # aparecem no log sem interromper, para não travar a entrega por
      # algo que costuma estar em dependência de desenvolvimento.
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
