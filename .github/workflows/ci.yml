name: CI

# Roda em toda alteração da main e em todo pull request. O objetivo é que
# nada chegue à main sem passar por lint, testes, auditoria de
# dependências e varredura de segredos.

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerabilidade nova não espera commit: a auditoria roda semanalmente
  # mesmo sem alteração no código.
  schedule:
    - cron: '0 6 * * 1'

# Cancela execuções antigas do mesmo branch, para não gastar fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    # A suíte roda contra Postgres, o mesmo motor da produção. Rodar em
    # SQLite aqui esconderia divergências de dialeto até o deploy.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palladino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks precisa do histórico para varrer commits anteriores.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Mesma versão de render.yaml e do desenvolvimento.
          node-version: '24'
          cache: npm

      # Segredos gerados por execução, nunca escritos no repositório.
      #
      # A primeira versão deste arquivo trazia os valores literais, e o
      # gitleaks os apontou como segredo vazado — corretamente, porque um
      # valor com entropia alta num arquivo versionado é indistinguível de
      # uma chave real. Gerar aqui resolve os dois lados: não há nada para
      # o scanner achar, e cada execução usa um valor descartável.
      - name: Gerar segredos descartáveis
        run: |
          JWT="$(openssl rand -base64 48 | tr -d '\n')"
          ENC="$(openssl rand -base64 32 | tr -d '\n')"

          # Mascara nos logs: as etapas seguintes imprimem o bloco env.
          echo "::add-mask::$JWT"
          echo "::add-mask::$ENC"

          {
            echo "JWT_SECRET=$JWT"
            echo "ENCRYPTION_KEY=$ENC"
            echo "APP_URL=http://localhost:3000"
            # Postgres do serviço acima. Credenciais locais ao runner,
            # descartadas com ele.
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/palladino_test"
            echo "TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/palladino_test"
          } >> "$GITHUB_ENV"

      # Os testes de backup chamam pg_dump e pg_restore. A imagem do
      # runner traz o cliente 16; a 18 é necessária para ler despejos do
      # servidor 18.
      - name: Instalar cliente do PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Instalar dependências
        run: npm ci

      # Antes de tsc e do build: os dois dependem dos tipos gerados.
      - name: Gerar o cliente do Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npx tsc --noEmit

      - name: Aplicar migrações no banco de testes
        run: npx prisma migrate deploy

      - name: Testes
        run: npm test

      - name: Build
        run: npx next build

      # Falha em vulnerabilidade alta ou crítica. Moderadas e baixas
      # aparecem no log sem interromper, para não travar a entrega por
      # algo que costuma estar em dependência de desenvolvimento.
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
