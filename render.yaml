# Deploy no Render (https://render.com).
#
# O plano gratuito não oferece disco persistente — `render blueprints
# validate` recusa com "disks are not supported for free tier services".
# Por isso o estado fica todo no Postgres: o banco, e também as imagens
# enviadas pelo painel, na tabela Arquivo. O sistema de arquivos da
# aplicação é descartável, e nada importante depende dele.
#
# As imagens do catálogo que vieram versionadas seguem em public/ e são
# servidas estaticamente.

# O banco NÃO é declarado aqui de propósito.
#
# O Postgres gratuito do Render expira 30 dias depois de criado — não
# hiberna, é excluído, junto com os dados. Por isso o banco fica num
# provedor com plano gratuito permanente (Neon ou Supabase), e a URL de
# conexão entra como variável do serviço.

services:
  - type: web
    name: palladino-profumeria
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /

    envVars:
      # URL do Postgres externo. Preencha pelo painel do Render.
      # Precisa de sslmode=require — Neon e Supabase exigem TLS.
      # Ex.: postgresql://user:senha@host.neon.tech/palladino?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Gere com: openssl rand -base64 48
      # A aplicação não sobe sem isso, e não existe valor padrão de propósito.
      - key: JWT_SECRET
        generateValue: true

      # Cifra CPF, tokens de integração e segredos de 2FA em repouso.
      #
      # NÃO use generateValue aqui. O banco já contém dados cifrados com
      # uma chave existente, e uma chave nova não os decifra: os campos
      # viram bytes ilegíveis, sem recuperação possível. Deixar o Render
      # gerar o valor a cada relançamento do blueprint destruiria esses
      # dados em silêncio, sem erro de build e sem erro em tempo de
      # execução — a falha só apareceria ao ler um registro antigo.
      #
      # Por isso é sync:false: o valor entra pelo painel, vindo do
      # gerenciador de senhas. Para uma instalação nova, sem dados,
      # gere a primeira chave com: openssl rand -base64 32
      - key: ENCRYPTION_KEY
        sync: false

      - key: NODE_VERSION
        value: "24"

      # Publica a política CSP estrita em paralelo, sem bloquear, para
      # medir o que ainda quebraria. Lida no build.
      - key: CSP_REPORT_ONLY
        value: "true"

      # Preencha pelo painel do Render (sync:false para não ficarem
      # escritas neste arquivo, que é público).
      #
      # APP_URL é a URL pública do serviço. Obrigatória: sem ela os links
      # de e-mail dependeriam do header Host, que o cliente controla.
      - key: APP_URL
        sync: false

      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: CEP_ORIGEM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # SMTP, para e-mails transacionais e redefinição de senha.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Turnstile (CAPTCHA). A SITE_KEY afeta o CSP e é lida no build.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
